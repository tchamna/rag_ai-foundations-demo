name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Build and Push to AWS ECR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rag-studio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy through Systems Manager
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, time
          def aws(*args):
              return subprocess.check_output(['aws','--region','us-east-1',*args],text=True)
          payload={'InstanceIds':['i-06e1cb3f5231e7804'],'DocumentName':'AWS-RunShellScript',
                   'Parameters':{'commands':[pathlib.Path('scripts/deploy_studio.sh').read_text()], 'executionTimeout':['900']}}
          pathlib.Path('command.json').write_text(json.dumps(payload))
          command=aws('ssm','send-command','--cli-input-json','file://command.json','--query','Command.CommandId','--output','text').strip()
          for _ in range(100):
              time.sleep(10)
              invocation=json.loads(aws('ssm','get-command-invocation','--instance-id','i-06e1cb3f5231e7804','--command-id',command))
              if invocation['Status'] in ['Pending','InProgress','Delayed']: continue
              print(invocation.get('StandardOutputContent',''))
              print(invocation.get('StandardErrorContent',''))
              if invocation['Status'] != 'Success': raise SystemExit('Deployment failed; inspect Systems Manager command '+command)
              break
          else: raise SystemExit('Timed out waiting for deployment '+command)
          PY
      - name: Verify public Studio API
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 https://rag.tchamna.com/api/generic/status | python -c "import sys,json; data=json.load(sys.stdin); assert 'retrieval' in data; print('RAG Studio online')"

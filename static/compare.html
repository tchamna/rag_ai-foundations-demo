<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model Compare - NJ Sharing Network Knowledge Chat</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="compare-shell">
      <header class="compare-header">
        <div class="brand compact-brand">
          <div class="mark">
            <span>NJ</span>
            <strong>Sharing</strong>
            <em>Network</em>
          </div>
          <div>
            <p class="eyebrow">Parallel model evaluation</p>
            <h1>Compare RAG Answers</h1>
          </div>
        </div>
        <nav class="compare-nav">
          <a href="/njsharing">Chat</a>
          <div id="compare-ready" class="ready-pill">Checking</div>
        </nav>
      </header>

      <section class="compare-intro">
        <div>
          <h2>Ask once. Compare OpenAI, Claude, and Ollama side by side.</h2>
          <p>Each model receives the same retrieved context and citation numbers. Calls run in parallel.</p>
        </div>
      </section>

      <form id="compare-form" class="compare-form">
        <textarea id="compare-input" rows="2" placeholder="Ask a document question to compare all model answers..."></textarea>
        <button id="compare-send" type="submit">Compare</button>
      </form>

      <section class="question-strip">
        <div class="section-row">
          <h2>Question Ideas</h2>
          <input id="question-filter" class="question-filter" type="search" placeholder="Filter ideas..." />
        </div>
        <div id="question-bank" class="question-bank horizontal"></div>
      </section>

      <section id="compare-results" class="compare-grid"></section>

      <section class="panel compare-citations">
        <div class="panel-head">
          <h2>Shared Citations</h2>
        </div>
        <div id="compare-citations" class="citation-list"></div>
      </section>

      <div id="citation-modal" class="modal" hidden>
        <div class="modal-backdrop" data-close-modal></div>
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <button class="modal-close" type="button" data-close-modal aria-label="Close citation">Close</button>
          <p id="modal-kicker" class="eyebrow"></p>
          <h2 id="modal-title"></h2>
          <p id="modal-location" class="modal-location"></p>
          <div id="modal-text" class="modal-text"></div>
        </section>
      </div>
    </main>

    <script src="/static/compare.js"></script>
  </body>
</html>
